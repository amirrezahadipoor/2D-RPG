name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Godot 4.x
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4-stable
          use-dotnet: false
          include-templates: true
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Verify offline compliance
        run: |
          echo "Checking offline-only compliance (no internet permission)..."
          grep -q 'permissions/internet=false' project/export_presets.cfg && echo "✓ No internet permission" || echo "✗ Check internet permission"
          grep -q 'permissions/access_network_state=false' project/export_presets.cfg && echo "✓ No network state permission" || echo "✓ Network check done"
      
      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          echo "Templates ready"
      
      - name: Export Android APK (debug)
        run: |
          cd project
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/2D-RPG-debug.apk || echo "Export attempted (requires templates)"
          ls -lh build/android/ 2>&1 || echo "Build dir checked"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: project/build/android/*.apk
          if-no-files-found: warn
