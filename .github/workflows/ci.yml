name: CI

# Real CI. Every step fails the build on error.
# (The previous ci.yml only `cat`-ed test files and wrote a hard-coded
#  <testsuite failures='0'/> XML. That is gone.)

on:
  push:
    branches: [main, rebuild/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Import + automated checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1-stable
          use-dotnet: false
          include-templates: false

      - name: Import project (must be clean)
        run: |
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" import.log; then
            echo "::error::GDScript parse/compile errors found"
            exit 1
          fi
          if grep -qE "^ERROR:" import.log; then
            echo "::error::engine errors during import"
            exit 1
          fi

      - name: Second import pass (cache warm, must also be clean)
        run: |
          godot --headless --path . --import 2>&1 | tee import2.log
          if grep -qE "SCRIPT ERROR|^ERROR:" import2.log; then
            echo "::error::errors on second import pass"
            exit 1
          fi

      - name: Run automated checks (exits non-zero on failure)
        run: godot --headless --path . res://tests/verify.tscn

      - name: Asset freshness (committed PNGs must match generator)
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/gen_assets.py
          if ! git diff --exit-code -- assets src/data/art_index.gd; then
            echo "::error::committed art is stale; run tools/gen_assets.py and commit"
            exit 1
          fi

  screenshots:
    name: Rendered screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1-stable
          use-dotnet: false
          include-templates: false

      - name: Install virtual display + GL deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglx-mesa0 libgl1-mesa-dri \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 \
            libxfixes3 libxkbcommon0 libasound2t64 libfontconfig1 libfreetype6

      - name: Import, then capture real renders
        run: |
          godot --headless --path . --import >/dev/null 2>&1
          godot --headless --path . --import >/dev/null 2>&1
          xvfb-run -a -s "-screen 0 1440x810x24" \
            godot --path . res://tools/screenshot.tscn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shots/*.png
          if-no-files-found: error
